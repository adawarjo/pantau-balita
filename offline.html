<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2a9d8f">
    <title>Sedang offline · Pantau Balita</title>
    <style>
        :root { --p: #2a9d8f; --pd: #1f7a6f; --bg: #f7f6f2; --t: #26323a; --m: #63707a; --b: #e7e4dc; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
               font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--t);
               background: linear-gradient(160deg, #e6f4f2 0%, var(--bg) 45%, #fdf0e6 100%); }
        .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--b); border-radius: 20px; padding: 32px 24px; text-align: center; }
        svg { display: block; margin: 0 auto; }
        h1 { font-size: 1.3rem; margin: 16px 0 8px; }
        p { color: var(--m); line-height: 1.55; margin: 0 0 12px; }
        .tips { text-align: left; background: #fdf0e6; border-radius: 14px; padding: 12px 16px; font-size: .9rem; color: #7a4a1c; margin: 16px 0; }
        .tips ul { margin: 6px 0 0; padding-left: 18px; }
        button { font: inherit; font-weight: 700; color: #fff; background: var(--p); border: 0; border-radius: 12px; padding: 12px 20px; width: 100%; cursor: pointer; }
        button:hover { background: var(--pd); }
        .status { font-size: .85rem; margin-top: 12px; color: var(--m); }
    </style>
</head>
<body>
    <main class="card">
        <svg width="72" height="72" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#2a9d8f"/><circle cx="32" cy="24" r="9" fill="#fdf0e6"/><path d="M16 50c2-10 9-15 16-15s14 5 16 15" fill="#fdf0e6"/><path d="M44 14c3 0 6 3 6 6s-3 6-6 6" fill="none" stroke="#f4a261" stroke-width="3" stroke-linecap="round"/><circle cx="29" cy="23" r="1.4" fill="#26323a"/><circle cx="35" cy="23" r="1.4" fill="#26323a"/><path d="M29 27.5c1.8 1.4 4.2 1.4 6 0" fill="none" stroke="#26323a" stroke-width="1.4" stroke-linecap="round"/></svg>
        <h1>Anda sedang offline</h1>
        <p>Pantau Balita membutuhkan koneksi internet untuk membuka dan menyimpan catatan anak.</p>
        <div class="tips">
            <strong>Demi privasi</strong>
            <ul>
                <li>Data anak dan kesehatan tidak disimpan di perangkat ini.</li>
                <li>Catatan yang belum terkirim perlu diisi ulang setelah koneksi kembali.</li>
            </ul>
        </div>
        <button type="button" id="retry">Coba lagi</button>
        <div class="status" id="status" aria-live="polite"></div>
    </main>
    <script>
        const status = document.getElementById('status');
        const retry = () => {
            status.textContent = 'Memeriksa koneksi…';
            location.reload();
        };
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', () => { status.textContent = 'Koneksi kembali, memuat ulang…'; setTimeout(() => location.reload(), 400); });
    </script>
</body>
</html>
